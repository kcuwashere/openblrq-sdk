[package]
name = "hello-server"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
openblrq = { path = "../../crates/openblrq", features = ["server"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
