[workspace]
resolver = "3"
members = ["crates/openblrq", "crates/openblrq-manifest", "cli"]
exclude = ["examples/hello-server", "examples/coin-rush"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kcuwashere/openblrq-sdk"

[workspace.dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
getrandom = "0.3"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
wit-bindgen = "0.63"
