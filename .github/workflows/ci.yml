name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-tools
        run: cargo install wasm-tools --version 1.263.0 --locked
      - run: wasm-tools component wit wit/ -o /dev/null
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - name: Build the example component
        working-directory: examples/hello-server
        run: |
          cargo build --release --target wasm32-wasip2
          wasm-tools validate target/wasm32-wasip2/release/hello_server.wasm
          cargo run -q -p obq --manifest-path ../../Cargo.toml -- check .
